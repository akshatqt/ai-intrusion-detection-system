<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Login Demo</title>

    <!--
      Simple, beginner-friendly login example
      - HTML for structure
      - CSS for basic styling
      - JavaScript (at the bottom) for logic
    -->

    <style>
      /* Basic page reset */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #0f172a;
        color: #e5e7eb;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }

      /* Container that holds the form */
      .login-card {
        width: 100%;
        max-width: 360px;
        background: #020617;
        border-radius: 12px;
        padding: 20px 18px 18px;
        box-shadow: 0 16px 35px rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(148, 163, 184, 0.4);
      }

      .login-title {
        margin-bottom: 4px;
        font-size: 1.1rem;
      }

      .login-subtitle {
        margin-bottom: 16px;
        font-size: 0.9rem;
        color: #9ca3af;
      }

      .form-group {
        margin-bottom: 12px;
      }

      .form-label {
        display: block;
        margin-bottom: 4px;
        font-size: 0.85rem;
        color: #e5e7eb;
      }

      .form-input {
        width: 100%;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid #4b5563;
        background: #020617;
        color: #e5e7eb;
        font-size: 0.9rem;
      }

      .form-input:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 1px #2563eb;
      }

      .login-button {
        width: 100%;
        margin-top: 8px;
        padding: 9px 12px;
        border-radius: 6px;
        border: none;
        background: #2563eb;
        color: white;
        font-weight: 500;
        font-size: 0.95rem;
        cursor: pointer;
      }

      .login-button:hover {
        background: #1d4ed8;
      }

      /* Error message styling */
      .error-message {
        margin-top: 8px;
        min-height: 18px; /* Keeps space even when empty */
        font-size: 0.85rem;
        color: #f97373;
      }

      .hint-text {
        margin-top: 10px;
        font-size: 0.8rem;
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <h1 class="login-title">Simple Login</h1>
      <p class="login-subtitle">Demo with fixed credentials.</p>

      <!--
        The form only has two fields:
        - username
        - password

        We will listen for the submit event with JavaScript
        and prevent the browser from reloading the page.
      -->
      <form id="loginForm">
        <!-- Username field -->
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input
            type="text"
            id="username"
            class="form-input"
            placeholder="Enter username"
            autocomplete="username"
            required
          />
        </div>

        <!-- Password field -->
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="Enter password"
            autocomplete="current-password"
            required
          />
        </div>

        <!-- Login button -->
        <button type="submit" class="login-button">Login</button>

        <!-- Error message area -->
        <p id="errorMessage" class="error-message"></p>

        <p class="hint-text">
          Fixed demo credentials: <strong>admin</strong> /
          <strong>admin123</strong>
        </p>
      </form>
    </div>

    <script>
      // Run this code only after the HTML has loaded
      document.addEventListener("DOMContentLoaded", function () {
        // 1. Get references to the elements we need
        const loginForm = document.getElementById("loginForm");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const errorMessage = document.getElementById("errorMessage");

        // 2. Define our fixed username and password
        const FIXED_USERNAME = "admin";
        const FIXED_PASSWORD = "admin123";

        // 3. Listen for the form's "submit" event
        loginForm.addEventListener("submit", function (event) {
          // Prevent the browser from reloading the page
          event.preventDefault();

          // Clear any previous error message
          errorMessage.textContent = "";

          // Read the current values from the inputs
          const enteredUsername = usernameInput.value.trim();
          const enteredPassword = passwordInput.value;

          // 4. Check if the entered values match our fixed credentials
          const isUsernameCorrect = enteredUsername === FIXED_USERNAME;
          const isPasswordCorrect = enteredPassword === FIXED_PASSWORD;

          if (isUsernameCorrect && isPasswordCorrect) {
            // 5a. If correct, redirect to the protected page
            // Here we redirect to the demo1 index page, one folder up
            window.location.href = "../demo1/index.html";
          } else {
            // 5b. If wrong, show an error message
            errorMessage.textContent = "Invalid credentials";
          }
        });
      });
    </script>
  </body>
</html>
